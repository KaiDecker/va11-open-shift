<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OPEN SHIFT</title>
  <style>
    @font-face { font-family: "Fusion Pixel"; src: url("../../assets/fonts/fusion-pixel-12px-proportional-zh_hans.woff2") format("woff2"); font-display: swap; }
    :root { --black:#09070d; --panel:#15101b; --panel2:#201426; --purple:#55206b; --purple2:#8e3ea3; --pink:#ff3c9d; --cyan:#48e6ff; --green:#63e6a1; --yellow:#f4df58; --white:#f4eafa; --dim:#a891ae; --red:#ff657c; }
    * { box-sizing:border-box; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; }
    body { color:var(--white); background:var(--black); font-family:"Fusion Pixel", "Microsoft YaHei UI", monospace; font-size:13px; letter-spacing:0; }
    button,input,select { color:inherit; font:inherit; letter-spacing:0; }
    button { cursor:pointer; }
    button:disabled { cursor:default; opacity:.4; }
    .screen { min-height:100%; display:flex; flex-direction:column; padding:16px; gap:10px; }
    .topline { display:flex; align-items:flex-end; justify-content:space-between; border-bottom:3px double var(--purple2); padding:0 4px 8px; }
    .brand { display:flex; align-items:center; gap:10px; }
    .brand img { width:44px; height:44px; image-rendering:pixelated; }
    h1 { margin:0; color:var(--pink); font-size:25px; line-height:1; font-weight:700; }
    .subtitle { color:var(--dim); font-size:10px; margin-top:5px; }
    .version { color:var(--cyan); font-size:10px; text-align:right; white-space:nowrap; }
    .panel { background:var(--panel); border:3px double var(--purple2); padding:12px; position:relative; }
    .panel-title { display:flex; align-items:center; gap:8px; color:var(--yellow); font-weight:700; margin-bottom:10px; }
    .panel-title:before { content:"◆"; color:var(--pink); font-size:10px; }
    .field { margin-bottom:11px; }
    .field:last-child { margin-bottom:0; }
    label { display:block; color:var(--cyan); font-size:11px; margin-bottom:5px; }
    .row { display:flex; min-width:0; gap:6px; }
    input,select { height:31px; min-width:0; flex:1; border:2px solid var(--purple); background:#08060b; padding:3px 7px; outline:0; border-radius:0; }
    input:focus,select:focus { border-color:var(--cyan); }
    select { flex:0 0 104px; color:var(--yellow); }
    .button { border:2px solid var(--purple2); border-right-color:#290d35; border-bottom-color:#290d35; background:var(--panel2); min-height:31px; padding:4px 10px; color:var(--white); }
    .button:hover:not(:disabled) { color:var(--yellow); border-color:var(--cyan); }
    .button:active:not(:disabled) { border-color:#290d35; border-right-color:var(--purple2); border-bottom-color:var(--purple2); }
    .button.primary { background:#3b174c; color:var(--pink); border-color:var(--pink); }
    .button.start { background:#123e42; color:var(--green); border-color:var(--green); }
    .button.danger { color:var(--red); }
    .hint { color:var(--dim); font-size:10px; line-height:1.35; margin-top:5px; }
    .safe { border:1px solid var(--purple); color:var(--dim); padding:8px; font-size:10px; line-height:1.45; }
    .safe strong { color:var(--green); font-weight:700; }
    .actions { display:flex; gap:8px; }
    .actions .button { flex:1; min-height:38px; }
    .secondary { display:flex; gap:8px; margin-top:8px; }
    .secondary .button { flex:1; }
    .status { min-height:24px; border-top:1px solid var(--purple); border-bottom:1px solid var(--purple); padding:5px 6px; color:var(--green); font-size:11px; line-height:1.35; }
    .status.error { color:var(--red); }
    .meter { height:7px; border:1px solid var(--purple); background:#0b080e; overflow:hidden; }
    .meter span { display:block; width:0; height:100%; background:var(--cyan); }
    .busy .meter span { width:45%; animation:move 1.1s steps(8,end) infinite; }
    @keyframes move { from { transform:translateX(-120%); } to { transform:translateX(300%); } }
    .footer { margin-top:auto; color:#6d5574; font-size:9px; display:flex; justify-content:space-between; }
    @media (max-height:700px) { .screen { padding:10px; gap:6px; } .panel { padding:9px; } .field { margin-bottom:7px; } }
  </style>
</head>
<body>
  <main class="screen" id="app">
    <header class="topline">
      <div class="brand"><img src="../../assets/open-shift-icon.svg" alt="OPEN SHIFT"><div><h1>OPEN SHIFT</h1><div class="subtitle">VA-11 HALL-A // 结局之后的世界</div></div></div>
      <div class="version">发行版<br><span id="version">读取中</span></div>
    </header>
    <section class="panel">
      <div class="panel-title">游戏连接</div>
      <div class="field"><label for="steam">STEAM 游戏目录</label><div class="row"><input id="steam" spellcheck="false"><button class="button" data-action="browse">选择</button></div><div class="hint" id="copy">尚未选择隔离实例。</div></div>
      <div class="field"><label for="key">DEEPSEEK API KEY</label><div class="row"><input id="key" type="password" spellcheck="false"><button class="button" data-action="saveKey">保存</button></div><div class="hint">使用 Windows DPAPI 加密保存，不写入日志。</div></div>
      <div class="field"><label for="thinkingToggle">生成模式 // THINKING</label><div class="row"><div class="hint" id="thinkingHint">安装后可选择生成模式。</div><select id="thinkingToggle" title="生成模式"><option value="disabled">快速</option><option value="balanced">平衡</option><option value="enabled">深度</option></select></div></div>
      <div class="safe"><strong>系统状态</strong><br>原版 DATA.WIN　只读输入<br>MOD DATA.WIN　隔离实例<br>世界状态　独立版本数据库<br><span id="diagnostic">版本读取中　|　密钥未配置　|　尚未安装</span></div>
    </section>
    <section class="panel">
      <div class="panel-title">控制台</div>
      <div class="actions"><button class="button primary" data-action="install">安装 / 修复</button><button class="button start" data-action="start">准备并启动</button></div>
      <div class="secondary"><button class="button" data-action="logs">打开日志</button><button class="button" data-action="export">导出诊断</button></div>
      <div class="secondary"><button class="button" data-action="update">检查更新</button><button class="button" id="release" data-action="updateOpen" hidden>打开发行页</button><button class="button danger" data-action="uninstall">卸载</button></div>
    </section>
    <div class="status" id="status">就绪 // Steam 原版文件保持不变。</div>
    <div class="meter"><span></span></div>
    <footer class="footer"><span>OPEN SHIFT 社区预览版</span><span>无 UTMT // 无原版 DATA</span></footer>
  </main>
  <script>
    const app=document.getElementById('app'), steam=document.getElementById('steam'), key=document.getElementById('key'), copy=document.getElementById('copy'), status=document.getElementById('status'), mode=document.getElementById('thinkingToggle'), hint=document.getElementById('thinkingHint');
    let busy=false, startDisabled=true, thinking='disabled', thinkingAvailable=false;
    function send(action,data={}) { if(window.chrome?.webview) window.chrome.webview.postMessage(JSON.stringify({action,...data})); }
    let releaseUrl='https://github.com/KaiDecker/va11-open-shift/releases/latest';
    async function checkUpdate() { status.textContent='正在检查 GitHub 最新发行版...'; try { const response=await fetch('https://api.github.com/repos/KaiDecker/va11-open-shift/releases/latest',{headers:{Accept:'application/vnd.github+json'}}); if(!response.ok)throw new Error('HTTP '+response.status); const latest=await response.json(); releaseUrl=latest.html_url||releaseUrl; const current=(document.getElementById('version').textContent||'').replace(/^v/i,''); const remote=(latest.tag_name||'').replace(/^v/i,''); document.getElementById('release').hidden=false; status.textContent=remote&&remote!==current?'发现新版本 '+remote+'，点击“打开发行页”查看。':'已是最新版本。'; } catch(error) { status.textContent='无法联网检查更新，当前版本仍可正常使用。'; document.getElementById('release').hidden=true; } }
    function apply() {
      const text=thinking==='enabled'?'深度 // 对话最充分，等待时间最长':thinking==='balanced'?'平衡 // 关键世界决策启用思考':'快速 // 日常对话优先速度';
      hint.textContent=thinkingAvailable?text:'安装 OPEN SHIFT 后可切换生成模式。'; mode.value=thinking; mode.disabled=busy||!thinkingAvailable;
      document.querySelectorAll('[data-action]').forEach(b=>b.disabled=busy&&b.dataset.action!=='logs');
      document.querySelector('[data-action="start"]').disabled=busy||startDisabled; steam.disabled=busy; key.disabled=busy; app.classList.toggle('busy',busy);
    }
    function setState(s) { if(s.steam!==undefined)steam.value=s.steam; if(s.copy!==undefined)copy.textContent='隔离实例 // '+s.copy; if(s.status)status.textContent=s.status; if(s.busy!==undefined){busy=!!s.busy;status.classList.toggle('error',/失败|错误|missing|failed/i.test(s.status||''));} if(s.startDisabled!==undefined)startDisabled=!!s.startDisabled; if(s.thinking!==undefined)thinking=s.thinking; if(s.thinkingAvailable!==undefined)thinkingAvailable=!!s.thinkingAvailable; if(s.packageVersion!==undefined)document.getElementById('version').textContent=s.packageVersion; if(s.keyConfigured!==undefined||s.installReady!==undefined)document.getElementById('diagnostic').textContent='版本 '+(s.packageVersion||'development')+'　|　密钥 '+(s.keyConfigured?'已配置':'未配置')+'　|　'+(s.installReady?'安装完成':'尚未安装'); apply(); }
    window.setState=setState;
    document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{const a=b.dataset.action;if(a==='browse')send(a);else if(a==='saveKey')send(a,{value:key.value});else if(a==='install')send(a,{steam:steam.value,key:key.value});else if(a==='update')checkUpdate();else if(a==='updateOpen')send('updateOpen',{url:releaseUrl});else send(a);}));
    mode.addEventListener('change',()=>send('thinking',{value:mode.value})); steam.addEventListener('change',()=>send('steamChanged',{value:steam.value})); apply();
  </script>
</body>
</html>
