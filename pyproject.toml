[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-shift-simulator"
version = "0.8.0"
description = "Persistent, event-driven multi-agent world simulator for the Open Shift prototype."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
open-shift = "open_shift.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
